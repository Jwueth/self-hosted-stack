# Glance localhost
server {
    listen 80;
    server_name glance.localhost;

    location / {
        proxy_pass http://glance:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Glance HTTPS
server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/nginx/certificates/serveur.pem;
    ssl_certificate_key /etc/nginx/certificates/serveur-key.pem;
    
    include /etc/nginx/conf.d/ssl_common.inc;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Endpoint interne Authelia (DANS le server block)
    location /authelia {
        internal;
        set $upstream_authelia http://authelia:9091/api/verify;
        proxy_pass $upstream_authelia;
        
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Glance PUBLIC
    location / {
        proxy_pass http://glance:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Glance PROTÉGÉ (/monitoring)
    location /monitoring {
        auth_request /authelia;
        
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;
        
        error_page 401 =302 https://authelia.example.com/?rd=$scheme://$http_host$request_uri;
    }

    # Glance PROTÉGÉ (/stats)
    location /stats {
        auth_request /authelia;
        
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;
        
        error_page 401 =302 https://authelia.example.com/?rd=$scheme://$http_host$request_uri;

    }
    # Glance PROTÉGÉ (/journal)
    location /journal {
        auth_request /authelia;
        
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;
        
        error_page 401 =302 https://authelia.example.com/?rd=$scheme://$http_host$request_uri;
        
        proxy_pass http://glance:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $user;
        proxy_cache_bypass $http_upgrade;
    }
}