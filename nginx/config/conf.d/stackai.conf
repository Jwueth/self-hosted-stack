# Ollama local HTTP
server {
    listen 80;
    server_name ollama.localhost _;

    location / {
        proxy_pass http://ollama:11434;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }
}

# Openwebui HTTPS
server {
    listen 443 ssl http2;
    server_name ia.example.com;

    ssl_certificate /etc/nginx/certificates/serveur.pem;
    ssl_certificate_key /etc/nginx/certificates/serveur-key.pem;

    include /etc/nginx/conf.d/ssl_common.inc;
    add_header X-Frame-Options "DENY" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Forwarded-Scheme https;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;

    keepalive_timeout 3600;
    proxy_connect_timeout 3600;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    location /static/ {
        proxy_pass http://openwebui:8080/static/;
    }

    location / {
        proxy_pass http://openwebui:8080;
    }
}

