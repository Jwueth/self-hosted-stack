# Calibre 
server {
    listen 80;
    server_name calibre.localhost;
    
    # Timeout configurations pour KasmVNC
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 50M;
    
    location / {
        proxy_pass http://calibre:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers spécifiques pour KasmVNC
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        
        # Désactiver la mise en cache pour les connexions WebSocket
        proxy_cache_bypass $http_upgrade;
        
        # Headers additionnels pour VNC
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
    }
    
    # Location spécifique pour les WebSockets si nécessaire
    location /websockify {
        proxy_pass http://calibre:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

# Calibre-Web - HTTP pour localhost
server {
    listen 80;
    server_name books.localhost _;
    
    # Taille maximale pour les uploads de livres
    client_max_body_size 200M;
    
    location / {
        proxy_pass http://calibre-web:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        
        # Headers pour l'authentification
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Scheme http;
        
        # Timeouts pour les opérations longues
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        
        # Désactiver la mise en cache
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    
    # Location pour les téléchargements de livres
    location ~* \.(epub|pdf|mobi|azw|azw3|fb2|txt)$ {
        proxy_pass http://calibre-web:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        
        # Timeout étendu pour les gros fichiers
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 443 ssl http2;
    server_name books.example.com;

    ssl_certificate /etc/nginx/certificates/serveur.pem;
    ssl_certificate_key /etc/nginx/certificates/serveur-key.pem;
    
    include /etc/nginx/conf.d/ssl_common.inc;
    add_header X-Frame-Options "DENY" always;
    
    # Taille maximale pour les uploads de livres
    client_max_body_size 200M;

    # ============================================
    # AUTHELIA - Endpoint interne de vérification
    # ============================================
    location /authelia {
        internal;
        set $upstream_authelia http://authelia:9091/api/verify;
        proxy_pass $upstream_authelia;
        
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    
    # ============================================
    # CALIBRE-WEB - Protégé par Authelia
    # ============================================
    location / {
        # Vérification Authelia
        auth_request /authelia;
        
        # Variables utilisateur
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        
        # Redirection vers Authelia si pas authentifié
        error_page 401 =302 https://authelia.example.com/?rd=$scheme://$http_host$request_uri;
        
        # Proxy vers Calibre-Web
        proxy_pass http://calibre-web:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Remote-User $user;
        
        # Headers pour l'authentification
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Scheme https;
        
        # Timeouts pour les opérations longues
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        
        # Désactiver la mise en cache
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    
    # ============================================
    # TÉLÉCHARGEMENTS - Également protégés
    # ============================================
    location ~* \.(epub|pdf|mobi|azw|azw3|fb2|txt)$ {
        # Vérification Authelia
        auth_request /authelia;
        
        # Variables utilisateur
        auth_request_set $user $upstream_http_remote_user;
        
        # Redirection vers Authelia si pas authentifié
        error_page 401 =302 https://authelia.example.com/?rd=$scheme://$http_host$request_uri;
        
        # Proxy vers Calibre-Web
        proxy_pass http://calibre-web:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Remote-User $user;
        
        # Timeout étendu pour les gros fichiers
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}