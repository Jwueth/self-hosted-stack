# Metabase  localhost

server {
    listen 80;
    server_name metabase.localhost;

    location / {
        proxy_pass http://metabase:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Metabase https

server {
    listen 443 ssl http2;
    server_name metabase.example.com;

    ssl_certificate /etc/nginx/certificates/serveur.pem;
    ssl_certificate_key /etc/nginx/certificates/serveur-key.pem;

    include /etc/nginx/conf.d/ssl_common.inc;
    # No X-Frame-Options: Metabase public dashboards are embedded as iframes in Glance

    # =========================
    # Endpoint interne Authelia
    # =========================
    location /authelia {
        internal;
        proxy_pass http://authelia:9091/api/verify;

        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # =========================
    # 🔓 Bypass Authelia
    # =========================
    # API Metabase / embeds / public
    location ~ ^/(app|api|public|embed)/ {
        proxy_pass http://metabase:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Accept-Encoding "gzip";
    }

    # =========================
    # 🔐 Interface Metabase
    # =========================
    location / {
        auth_request /authelia;

        # Infos user (optionnel mais propre)
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;

        error_page 401 =302 https://authelia.example.com/?rd=$scheme://$http_host$request_uri;

        proxy_pass http://metabase:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Accept-Encoding "gzip";
    }
}