# Portainer domaine public HTTPS
server {
    listen 443 ssl http2;
    server_name portainer.example.com;
    
    # Configuration SSL avec certificats Cloudflare
    ssl_certificate /etc/nginx/certificates/serveur.pem;
    ssl_certificate_key /etc/nginx/certificates/serveur-key.pem;
    
    include /etc/nginx/conf.d/ssl_common.inc;
    add_header X-Frame-Options "DENY" always;
    
    # Endpoint interne Authelia (copier dans chaque config)
    location /authelia {
        internal;
        set $upstream_authelia http://authelia:9091/api/verify;
        proxy_pass $upstream_authelia;

        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Tout le sous-domaine est protégé
    location / {
        # Vérifie avec Authelia
        auth_request /authelia;

        # Variables user
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;

        # Redirige vers login si pas authentifié
        error_page 401 =302 https://authelia.example.com/?rd=$scheme://$http_host$request_uri;

        # Portainer écoute sur le port 9443 (HTTPS)
        proxy_pass https://portainer:9443;
        proxy_http_version 1.1;
        
        # Configuration SSL pour le proxy backend
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        
        # Headers de proxy - Important pour Portainer
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Support WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 900s;
        
        # Buffer settings pour Portainer
        proxy_buffering off;
        proxy_request_buffering off;
    }
}