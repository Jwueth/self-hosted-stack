# NocoDB localhost

server {
    listen 80;
    server_name nocodb.localhost;

    location / {
        proxy_pass http://nocodb:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
    }
}

# NocoDB HTTPS

server {
    listen 443 ssl http2;
    server_name nocodb.example.com;

    ssl_certificate /etc/nginx/certificates/serveur.pem;
    ssl_certificate_key /etc/nginx/certificates/serveur-key.pem;

    include /etc/nginx/conf.d/ssl_common.inc;
    add_header X-Frame-Options "DENY" always;

    location /authelia {
        internal;
        proxy_pass http://authelia:9091/api/verify;

        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location / {
        auth_request /authelia;

        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;

        error_page 401 =302 https://authelia.example.com/?rd=$scheme://$http_host$request_uri;

        proxy_pass http://nocodb:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Accept-Encoding gzip;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
    }
}

# Redirect HTTP vers HTTPS

server {
    listen 80;
    server_name nocodb.example.com;
    return 301 https://$server_name$request_uri;
}