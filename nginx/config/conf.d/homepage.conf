# Homepage HTTPS
server {
    listen 443 ssl http2;
    server_name home.example.com;

    ssl_certificate /etc/nginx/certificates/serveur.pem;
    ssl_certificate_key /etc/nginx/certificates/serveur-key.pem;

    include /etc/nginx/conf.d/ssl_common.inc;
    # No X-Frame-Options: Homepage is embedded as iframe in Glance dashboard

    # ✅ Route pour l'API LoL
    location /lol/ {
        proxy_pass http://lol-matches-api:8000/lol/;  # ← Notez le /lol/ à la fin
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # ✅ Route pour le widget
    location /widget {
        proxy_pass http://lol-matches-api:8000/widget;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ✅ Route pour les fichiers static
    location /static/ {
        proxy_pass http://lol-matches-api:8000/static/;
        proxy_set_header Host $host;
    }

    # Homepage - doit être EN DERNIER car c'est le catch-all
    location / {
        proxy_pass http://homepage:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Homepage local HTTP
