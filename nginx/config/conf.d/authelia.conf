
server {
    listen 443 ssl http2;
    server_name authelia.example.com;

    ssl_certificate /etc/nginx/certificates/serveur.pem;
    ssl_certificate_key /etc/nginx/certificates/serveur-key.pem;
    
    include /etc/nginx/conf.d/ssl_common.inc;
    add_header X-Frame-Options "DENY" always;

    # Proxy TOUT vers Authelia (pas juste /)
    location / {
        proxy_pass http://authelia:9091;
        proxy_http_version 1.1;
        
        # Headers essentiels
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-URI $request_uri;
        
        # Support WebSocket (pour les sessions)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}