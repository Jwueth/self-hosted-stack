#yourspotify

server {
    listen 443 ssl http2;
    server_name sound.example.com;

    ssl_certificate /etc/nginx/certificates/serveur.pem;
    ssl_certificate_key /etc/nginx/certificates/serveur-key.pem;

    include /etc/nginx/conf.d/ssl_common.inc;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/yourspotify_access.log;
    error_log /var/log/nginx/yourspotify_error.log;
    client_max_body_size 10M;

    location / {
        proxy_pass http://yourspotify:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }
}