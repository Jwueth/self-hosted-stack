# yaml-language-server: $schema=https://raw.githubusercontent.com/not-first/glance-schema/master/schema.json
theme:
  light: false
  background-color: "240 8 9"
  primary-color: "43 50 70"
  negative-color: "0 70 70"
  contrast-multiplier: 1
  text-saturation-multiplier: 1
  disable-picker: true
pages:
  - name: Homepage
    columns: # début structure colonne
      - size: small # colonne gauche
        widgets:
          - type: weather
            hide-header: true
            location: Your City, Country
            units: metric # alternatively "imperial"
            hour-format: 24h # alternatively "24h"
            hide-location: true
          - type: html #Vidéos titre
            source: |
              <style>
                .section-header:hover {
                  transform: translateX(5px);
                }
                .section-header:hover h2 {
                  color: hsl(43, 50%, 70%) !important;
                }
              </style>
                <div class="section-header" style="border-left: 2px solid hsl(43, 50%, 70%); padding-left: 12px; margin-top: 20px; margin-bottom: 5px; transition: all 0.2s;">
                  <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: hsl(43, 50%, 70%); transition: color 0.2s;">
                    Liens
                  </h2>
                </div>
          - type: group #Bookmarks
            widgets:
              - type: bookmarks
                title: Essentials
                color: 43 50 70
                groups:
                  - links:
                    - title: My Website
                      url: https://example.com
                    - title: My Resources
                      url: https://example.com/resources
              - type: bookmarks
                title: Social
                groups:
                  - links:
                      - title: LinkedIn
                        description: My LinkedIn profile
                        url: https://linkedin.com/in/your-profile
                      - title: X
                        description: My X profile
                        url: https://x.com/your-handle
          - type: html #Docker titre
            source: |
              <style>
                .section-header:hover {
                  transform: translateX(5px);
                }
                .section-header:hover h2 {
                  color: hsl(43, 50%, 70%) !important;
                }
              </style>
                <div class="section-header" style="border-left: 2px solid hsl(43, 50%, 70%); padding-left: 12px; margin-top: 20px; margin-bottom: 5px; transition: all 0.2s;">
                  <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: hsl(43, 50%, 70%); transition: color 0.2s;">
                    Services
                  </h2>
                </div>
          - type: docker-containers
            title: Automatisations
            category: auto
          - type: docker-containers
            title: Médias et docs
            category: medias
          - type: docker-containers
            title : Stack IA 
            category: ia
          - type: docker-containers
            title: Dashboards et monitoring
            category: monitoring
          - type: docker-containers
            title: Base de données
            category: bdds
          - type: html #Twitch titre
            source: |
              <style>
                .section-header:hover {
                  transform: translateX(5px);
                }
                .section-header:hover h2 {
                  color: hsl(43, 50%, 70%) !important;
                }
              </style>
                <div class="section-header" style="border-left: 2px solid hsl(43, 50%, 70%); padding-left: 12px; margin-top: 20px; margin-bottom: 5px; transition: all 0.2s;">
                  <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: hsl(43, 50%, 70%); transition: color 0.2s;">
                    Twitch
                  </h2>
                </div>
          - type: twitch-channels
            hide-header: true
            channels:
              - your_channel_1
              - your_channel_2
          - type: releases
            cache: 1d            
            repositories:
              - glanceapp/glance
              - authelia/authelia

      - size: full
        widgets:
          - type: html #Yourspotify titre
            source: |
                <div style="border-left: 2px solid hsl(141, 76%, 48%); padding-left: 12px; margin-bottom: 5px; transition: transform 0.2s;">
                  <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: hsl(141, 76%, 48%);">
                    Yourspotify Top
                  </h2>
                  </span>
                </div>
          - type: group #Yourspotify group
            widgets:
            - type: custom-api #Top 20 mensuel small
              title: Top 20 du mois
              cache: 24h
              url: https://${WEBHOOK_URL}/yourspotify-top
              headers:
                x-api-key: ${N8N_API_KEY}
              template: |
                <style>
                  .track-compact:hover img {
                    transform: scale(1.05);
                    border-color: #1ed760 !important;
                  }
                </style>
                <div style="font-size: 12px; opacity: 0.7; margin-bottom: 10px;">
                  {{ .JSON.String "period" }} • {{ .JSON.Int "total" }} morceaux
                </div>
                <div style="display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px;">
                  {{ range .JSON.Array "tracks" }}
                    <a href="https://open.spotify.com/track/{{ .String "trackId" }}" 
                      target="_blank"
                      class="track-compact"
                      style="flex-shrink: 0; width: 130px; scroll-snap-align: start; background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; text-align: center; text-decoration: none; color: inherit; display: block;">
                      <img src="{{ .String "albumArt" }}" 
                          style="width: 100px; height: 100px; margin: 0 auto 8px; object-fit: cover; border-radius: 6px; border: 2px solid #1DB954; transition: all 0.2s;">
                      
                      <div style="font-weight: 700; font-size: 11px; margin-bottom: 3px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 26px; color: hsl(43,50%,70%)";>
                        {{ .String "title" }}
                      </div>
                      
                      <div style="font-size: 10px; opacity: 0.7; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        {{ .String "artist" }}
                      </div>
                      
                      <div style="color: #1DB954; font-weight: 700; font-size: 11px;">
                        {{ .Int "count" }} ▶
                      </div>
                    </a>
                  {{ end }}
                </div>
            - type: custom-api # Top 20 annuel version small
              title: Top titres
              cache: 24h
              url: https://${WEBHOOK_URL}/topsongyear
              headers:
                x-api-key: ${N8N_API_KEY}
              template: |
                  <style>
                    .track-compact-year:hover img {
                      transform: scale(1.05);
                      border-color: #1ed760 !important;
                    }
                  </style>
                  <div style="font-size: 12px; opacity: 0.7; margin-bottom: 10px;">
                    {{ .JSON.String "period" }} • {{ .JSON.Int "total" }} morceaux
                  </div>
                  <div style="display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px;">
                    {{ range .JSON.Array "tracks" }}
                      <a href="https://open.spotify.com/track/{{ .String "trackId" }}" 
                        target="_blank"
                        class="track-compact-year"
                        style="flex-shrink: 0; width: 130px; scroll-snap-align: start; background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; text-align: center; text-decoration: none; color: inherit; display: block;">
                        <img src="{{ .String "albumArt" }}" 
                            style="width: 100px; height: 100px; margin: 0 auto 8px; object-fit: cover; border-radius: 6px; border: 2px solid #1DB954; transition: all 0.2s;">
                        
                        <div style="font-weight: 700; font-size: 11px; margin-bottom: 3px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 26px;color: hsl(43,50%,70%)">
                          {{ .String "title" }}
                        </div>
                        
                        <div style="font-size: 10px; opacity: 0.7; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                          {{ .String "artist" }}
                        </div>
                        
                        <div style="color: #1DB954; font-weight: 700; font-size: 11px;">
                          {{ .Int "count" }} ▶
                        </div>
                      </a>
                    {{ end }}
                  </div>  
            - type: custom-api # Top artistes version small
              title: Top Artistes
              cache: 24h
              url: https://${WEBHOOK_URL}/top-artists
              headers:
                X-API-Key: ${N8N_API_KEY}
              template: |
                  <style>
                    .artist-compact:hover img {
                      transform: scale(1.05);
                      border-color: #1ed760 !important;
                    }
                  </style>
                  <div style="font-size: 12px; opacity: 0.7; margin-bottom: 10px;">
                    {{ .JSON.String "period" }} • {{ .JSON.Int "total" }} artistes
                  </div>
                  <div style="display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px;">
                    {{ range .JSON.Array "topartists" }}
                      <a href="https://open.spotify.com/intl-fr/artist/{{ .String "artistsID" }}" 
                        target="_blank"
                        class="artist-compact"
                        style="flex-shrink: 0; width: 130px; scroll-snap-align: start; background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; text-align: center; text-decoration: none; color: inherit; display: block;">
                        <img src="{{ .String "albumArt" }}" 
                            style="width: 100px; height: 100px; margin: 0 auto 8px; object-fit: cover; border-radius: 50%; border: 2px solid #1DB954; transition: all 0.2s;">
                        
                        <div style="font-weight: 700; font-size: 11px; margin-bottom: 3px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 26px;color: hsl(43,50%,70%)">
                          {{ .String "artist" }}
                        </div>
                        
                        {{ $genre := .String "genre" }}
                        {{ if ne $genre "Unknown" }}
                        <div style="font-size: 9px; opacity: 0.6; font-style: italic; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                          {{ $genre }}
                        </div>
                        {{ else }}
                        <div style="height: 17px; margin-bottom: 6px;"></div>
                        {{ end }}
                        
                        <div style="color: #1DB954; font-weight: 700; font-size: 11px;">
                          {{ .Int "count" }} ▶
                        </div>
                      </a>
                    {{ end }}
                  </div>        
          - type: html #Notion titre
            source: |
              <style>
                .section-header:hover {
                  transform: translateX(5px);
                }
                .section-header:hover h2 {
                  color: hsl(43, 50%, 70%) !important;
                }
              </style>
                <div class="section-header" style="border-left: 2px solid hsl(43, 50%, 70%); padding-left: 12px; margin-top: 20px; margin-bottom: 5px; transition: all 0.2s;">
                  <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: hsl(43, 50%, 70%); transition: color 0.2s;">
                    Ressources Notion
                  </h2>
                  </span>
                </div>
          - type: group
            widgets:
              - type: custom-api #Ressources notion
                title: Ressources
                url: https://${WEBHOOK_URL}/ressources_notion
                headers:
                  X-API-Key: ${N8N_API_KEY}
                template: |
                      <div style="font-size: 12px; opacity: 0.7; margin-bottom: 10px;">
                        {{ .JSON.Int "metadata.total" }} dernières ressources Notion • Mise à jour : {{ .JSON.String "metadata.generated_at" }}
                      </div>
                      <div style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;">
                        {{ range .JSON.Array "pages" }}
                          <div style="flex-shrink: 0; width: 280px; border-left: 3px solid #d9c38c94; padding-left: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px;">
                            <a href="{{ .String "url" }}" 
                              target="_blank"
                              style="font-weight: 600; font-size: 13px; color: inherit; text-decoration: none; display: block; margin-bottom: 8px; line-height: 1.3;color: hsl(43,50%,70%)">
                              {{ .String "title" }}
                            </a>
                            
                            <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px;">
                              {{ $categories := .String "categories" }}
                              {{ if $categories }}
                              <span style="background: rgba(168, 85, 247, 0.1); color: #ff6bcb94; padding: 2px 6px; border-radius: 10px; font-size: 9px; font-weight: 600;">
                                📁 {{ $categories }}
                              </span>
                              {{ end }}
                            </div>
                            
                            {{ $hashtags := .String "hashtags" }}
                            {{ if $hashtags }}
                            <div style="font-size: 10px; color: #1DB954; margin-bottom: 6px;">
                              {{ $hashtags }}
                            </div>
                            {{ end }}
                            
                            {{ $summary := .String "ai_summary" }}
                            {{ if ne $summary "Aucun contenu" }}
                            <div style="font-size: 10px; opacity: 0.6; line-height: 1.3; font-style: italic; max-height: 60px; overflow: hidden; text-overflow: ellipsis;color: hsl(43,70%,50%)">
                              {{ $summary }}
                            </div>
                            {{ end }}
                          </div>
                        {{ end }}
                      </div>
              - type: custom-api #Projets et template Notion
                title: Projets et templates
                url: https://${WEBHOOK_URL}/notion-projects
                headers:
                  X-API-Key: ${N8N_API_KEY}
                template: |
                      <div style="font-size: 12px; opacity: 0.7; margin-bottom: 10px;">
                        {{ .JSON.Int "metadata.total" }} Projets et template Notion • Mise à jour : {{ .JSON.String "metadata.generated_at" }}
                      </div>
                      <div style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;">
                        {{ range .JSON.Array "pages" }}
                          <div style="flex-shrink: 0; width: 280px; border-left: 3px solid #d9c38c94; padding-left: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px;">
                            <a href="{{ .String "url" }}" 
                              target="_blank"
                              style="font-weight: 600; font-size: 13px; color: inherit; text-decoration: none; display: block; margin-bottom: 8px; line-height: 1.3;color: hsl(43,50%,70%)">
                              {{ .String "title" }}
                            </a>
                            
                            <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px;">
                              {{ $categories := .String "categories" }}
                              {{ if $categories }}
                              <span style="background: rgba(168, 85, 247, 0.1); color: #ff6bcb94; padding: 2px 6px; border-radius: 10px; font-size: 9px; font-weight: 600;">
                                📁 {{ $categories }}
                              </span>
                              {{ end }}
                            </div>
                            
                            {{ $hashtags := .String "hashtags" }}
                            {{ if $hashtags }}
                            <div style="font-size: 10px; color: #1DB954; margin-bottom: 6px;">
                              {{ $hashtags }}
                            </div>
                            {{ end }}
                            
                            {{ $summary := .String "ai_summary" }}
                            {{ if ne $summary "Aucun contenu" }}
                            <div style="font-size: 10px; opacity: 0.6; line-height: 1.3; font-style: italic; max-height: 60px; overflow: hidden; text-overflow: ellipsis;color: hsl(43,70%,50%)">
                              {{ $summary }}
                            </div>
                            {{ end }}
                          </div>
                        {{ end }}
                      </div>
          - type: html #News titre
            source: |
              <style>
                .section-header:hover {
                  transform: translateX(5px);
                }
                .section-header:hover h2 {
                  color: hsl(43, 50%, 70%) !important;
                }
              </style>
                <div class="section-header" style="border-left: 2px solid hsl(43, 50%, 70%); padding-left: 12px; margin-top: 20px; margin-bottom: 5px; transition: all 0.2s;">
                  <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: hsl(43, 50%, 70%); transition: color 0.2s;">
                    News
                  </h2>
                </div>
          - type: split-column
            max-columns: 2
            widgets:
              - type: group
                widgets:
                - type: reddit
                  subreddit: selfhosted
                  show-thumbnails: true
                - type: reddit
                  subreddit: technology
                  show-thumbnails: true
                - type: reddit
                  subreddit: ollama
                  show-thumbnails: true
                - type: reddit
                  subreddit: docker
                  show-thumbnails: true

              - type: group
                widgets:
                - type: hacker-news
                  limit: 15
                  collapse-after: 5
                - type: rss
                  limit: 10
                  collapse-after: 5
                  cache: 12h
                  feeds:
                    - url: https://selfh.st/rss/
                      title: selfh.st
                      limit: 4
                    - url: https://ciechanow.ski/atom.xml
                    - url: https://www.joshwcomeau.com/rss.xml
                      title: Josh Comeau
                    - url: https://samwho.dev/rss.xml
                    - url: https://ishadeed.com/feed.xml
                      title: Ahmad Shadeed
          - type: html #Vidéos titre
            source: |
              <style>
                .section-header:hover {
                  transform: translateX(5px);
                }
                .section-header:hover h2 {
                  color: hsl(43, 50%, 70%) !important;
                }
              </style>
                <div class="section-header" style="border-left: 2px solid hsl(43, 50%, 70%); padding-left: 12px; margin-top: 20px; margin-bottom: 5px; transition: all 0.2s;">
                  <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: hsl(43, 50%, 70%); transition: color 0.2s;">
                    Youtube
                  </h2>
                </div>
          - type: videos
            title: Chaines
            hide-header: true
            style: grid-cards
            collapse-after-rows: 3
            channels:
              - UC_CHANNEL_ID_1 # Channel 1
              - UC_CHANNEL_ID_2 # Channel 2
            playlists:
              - PL_PLAYLIST_ID # Playlist 1

  - name : Monitoring
    head-widgets:
          - type: custom-api #Météo 7 jours
            title: Météo 
            body-type: string
            cache: 1h
            options:
              location: ${WEATHER_LOCATION} 
              weekend_color: "#34363D"
              color_clear: "#FFA500"
              color_partly: "#EBE387"
              color_cloud: "#A9A9A9"
              color_smog: "#D3D3D3" 
              color_drizzle: "#5F9EA0" 
              color_rain: "#4682B4" 
              color_freezing_rain: "#B0E0E6" 
              color_snow: "#FFFFFF" 
              color_thunderstorm: "#696969"
              color_other: "#FFFFFF"
              color_red: "#F08C46"
              color_yellow: "#F0F046"
              color_blue: "#46F0F0"
              color_white: "#FFFFFF"
            template: | 
              {{/* THESE VALUES CAN BE CHANGED BY ADDING AN ENTRY TO THE OPTIONS SECTION */}}
                {{ $temp_unit := .Options.StringOr "temp_unit" "celsius" }}
                {{ $weekend_color := .Options.StringOr "weekend_color" "var(--color-separator)" }}
                {{ $overlay_color := .Options.StringOr "overlay_color" "hsl(var(--bghs), var(--bgl), 50%)" }}
                {{/* the following variables define the coloring of the sunny/cloudy/etc. weather icons*/}}
                  {{ $color_clear := .Options.StringOr "color_clear" "var(--color-text-highlight)" }}
                  {{ $color_partly := .Options.StringOr "color_partly" "var(--color-text-highlight)"}}
                  {{ $color_cloud := .Options.StringOr "color_cloud" "var(--color-text-highlight)"}}
                  {{ $color_smog := .Options.StringOr "color_smog" "var(--color-text-highlight)"}}
                  {{ $color_drizzle := .Options.StringOr "color_drizzle" "var(--color-text-highlight)"}}
                  {{ $color_rain := .Options.StringOr "color_rain" "var(--color-text-highlight)"}}
                  {{ $color_freezing_rain := .Options.StringOr "color_freezing_rain" "var(--color-text-highlight)"}}
                  {{ $color_snow := .Options.StringOr "color_snow" "var(--color-text-highlight)F"}}
                  {{ $color_thunderstorm := .Options.StringOr "color_thunderstorm" "var(--color-text-highlight)"}}
                  {{ $color_other := .Options.StringOr "color_other" "var(--color-text-highlight)"}}
                {{/* the following variables define the temperature gradient coloring for the daily rectangles */}}
                {{ $color_red := .Options.StringOr "color_red" "var(--color-negative)" }}  
                {{ $color_yellow := .Options.StringOr "color_yellow" "var(--color-text-subdue)" }}
                {{ $color_blue := .Options.StringOr "color_blue" "var(--color-positive)" }}
                {{ $color_white := .Options.StringOr "color_white" "var(--color-text-highlight)" }}
                {{ $temp_red := .Options.FloatOr "temp_red" 27 }}
                {{ $temp_yellow := .Options.FloatOr "temp_yellow" 20 }}
                {{ $temp_blue := .Options.FloatOr "temp_blue" 10.0 }}
                {{ $temp_white := .Options.FloatOr "temp_white" 0 }}
                {{ if eq $temp_unit "fahrenheit" }}
                  {{ $temp_red = .Options.FloatOr "temp_red" 80.0 }}
                  {{ $temp_yellow = .Options.FloatOr "temp_yellow" 70.0 }}
                  {{ $temp_blue = .Options.FloatOr "temp_blue" 50.0 }}
                  {{ $temp_white = .Options.FloatOr "temp_white" 30.0 }}
                {{end}}

              {{/* Request 1: get latitude and longitude for user's city */}}
              {{ $location_string := replaceAll " " "%20" (.Options.StringOr "location" "") }}
              {{ $url1 := printf "https://geocoding-api.open-meteo.com/v1/search?name=%s&count=20&language=en&format=json" $location_string }}
              {{ $req1 := newRequest $url1 | getResponse }}
              {{ $latitude := $req1.JSON.String "results.0.latitude" }}
              {{ $longitude := $req1.JSON.String "results.0.longitude" }}

              {{/* Request 2: get daily weather forecast based on latitude and longitude */}}
              {{ $url2 := printf "https://api.open-meteo.com/v1/forecast?latitude=%s&longitude=%s&temperature_unit=%s&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=America/New_York" $latitude $longitude $temp_unit}}    
              {{ $req2 := newRequest $url2 | getResponse }}

              <div style="display: flex; justify-content: center; align-items: center; flex-direction: column;">
              
                {{/* Show abbreivated day of week */}}
                {{ $dates := $req2.JSON.Array "daily.time" }}
                <div style="position: relative; width: 100%; height: 25px;">  
                  {{ range $index, $date := $dates }}

                    {{/* prepare to print M Tu W Th F Sa Su */}}
                    {{ $dateString := .String "" }}
                    {{ $parsedDate := $dateString | parseTime "DateOnly" }}
                    {{ $dayOfWeek := $parsedDate.Format "Monday" | trimSuffix "day" | trimSuffix "on" | trimSuffix "es" | trimSuffix "edn" | 
                        trimSuffix "urs" | trimSuffix "ri" | trimSuffix "tur" | trimSuffix "n" }}  
                    
                    {{/* highlight weekends (Sa Su) */}}
                    {{ $day_color := "" }}
                    {{ if eq $dayOfWeek "Sa" "Su" }}
                      {{ $day_color = $weekend_color }}
                    {{ end }}

                    <div style="text-align: center; width: 10%; height: 25px; line-height: 25px; margin: 0 10% 0 3%; left: {{ mul $index 14 }}%; position: absolute; background-color: {{ $day_color | safeCSS }} ">
                      <p class="size-h4 color-paragraph">{{ $dayOfWeek }}</p> 
                    </div>
                  {{ end }}
                </div>

                {{/* Show numeric day of month */}}
                <div style="position: relative; width: 100%; height: 25px;">     
                  {{ range $index, $date := $dates }}
                    {{ $dateString := .String "" }}
                    {{ $trimmedDate := replaceMatches "[0-9]+-[0-9]+-" "" $dateString }}
                    <div style="text-align: center; width: 10%; height: 25px; line-height: 25px; margin: 0 10% 0 3%; left: {{ mul $index 14 }}%; position: absolute;">
                      <p class="size-h4 color-paragraph">{{ $trimmedDate }}</p> 
                    </div>
                  {{ end }}
                </div>

                {{/* Show weather conditions using fontawesome icons */}}
                <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
                {{ $codes := $req2.JSON.Array "daily.weathercode" }}

                <div style="position: relative; width: 100%; height: 30px;">     
                  {{ range $index, $thiscode := $codes }}
                    {{ $code := .Int "" }}

                    <div style="text-align: center; width: 10%; height: 25px; line-height: 25px; margin: 0 10% 0 3%; left: {{ mul $index 14 }}% ; position: absolute;">
                    {{ $wtype := "" }} 
                    {{ $wicon := "" }} 
                    {{ $wcolor := "" }} 
                    {{ if eq $code 0 }}
                      {{ $wtype = "Clear" }}
                      {{ $wicon = "fas fa-sun" }}
                      {{ $wcolor = $color_clear }}
                    {{ else if eq $code 1 2 }}
                      {{ $wtype = "Part Clear" }}
                      {{ $wicon = "fas fa-cloud-sun" }}
                      {{ $wcolor = $color_partly }} 
                    {{ else if eq $code 3 }}
                      {{ $wtype = "Cloudy" }}
                      {{ $wicon = "fas fa-cloud" }}
                      {{ $wcolor = $color_cloud }}
                    {{ else if eq $code 45 48 }}
                      {{ $wtype = "Fog" }}
                      {{ $wicon = "fas fa-smog" }}
                      {{ $wcolor = $color_smog }}
                    {{ else if eq $code 51 53 55 56 57 }}
                      {{ $wtype = "Drizzle" }}
                      {{ $wicon = "fas fa-cloud-rain" }}
                      {{ $wcolor = $color_drizzle }}
                    {{ else if eq $code 61 63 65 80 81 82 }}
                      {{ $wtype = "Rain" }}
                      {{ $wicon = "fas fa-cloud-showers-heavy" }}
                      {{ $wcolor = $color_rain }}
                    {{ else if eq $code 66 67 }}
                      {{ $wtype = "Freezing Rain" }}
                      {{ $wicon = "fas fa-snowflake" }}
                      {{ $wcolor = $color_freezing_rain }}
                    {{ else if eq $code 71 73 75 77 85 86 }}
                      {{ $wtype = "Snow" }}
                      {{ $wicon = "fas fa-snowman" }}
                      {{ $wcolor = $color_snow }}
                    {{ else if eq $code 95 96 99 }}
                      {{ $wtype = "Thunderstorm" }}
                      {{ $wicon = "fas fa-bolt" }}
                      {{ $wcolor = $color_thunderstorm }}
                    {{ else }}
                      {{ $wtype = "Other" }}
                      {{ $wicon = "fa-solid fa-question" }}
                      {{ $wcolor = $color_other }}
                    {{ end }}
                    <i class={{ $wicon }} style="font-size: 20px; color: {{ $wcolor | safeCSS }};", title = {{$wtype }}></i>
                    </div>
                  {{ end }}
                </div>
              </div>

              {{/* ===== show daily min and max temperatures ===== */}}
              {{ $maxTemps := $req2.JSON.Array "daily.temperature_2m_max" }}
              {{ $minTemps := $req2.JSON.Array "daily.temperature_2m_min" }} 

              {{/* get overall max and min temp over week's range */}}
              {{/* to determine vertical scale */}}
              <div style="display: flex; justify-content: flex-start; align-items: center;">

                {{ $max_max := 0 }}
                {{ range $maxTemps }}
                    {{ if gt (.Int "") $max_max }}
                      {{ $max_max = (.Int "") }}
                    {{ end }}
                {{ end }}
                {{ $min_min := 999 }}
                {{ range $minTemps }}
                    {{ if lt (.Int "") $min_min }}
                      {{ $min_min = (.Int "") }}
                    {{ end }}
                {{ end }}
                
                {{/* add a small buffer */}}
                {{ $max_max = add $max_max 1 }}
                {{ $min_min = sub $min_min 1 }}

                {{/* outer div to contain the temp chart */}}
                <div style="position: relative; width: 100%; height: 75px;">
                  {{/* get relative % heights for each daily max and min */}}
                  {{ $temp_range := sub $max_max $min_min }}

                  {{ range $index, $thisHigh := $maxTemps }}
                      {{ $thisLow := index $minTemps $index }}
                      {{ $thisHigh = $thisHigh.Float "" }}
                      {{ $thisLow = $thisLow.Float "" }}

                      {{ $thisHighPct := sub 1 (div (sub $max_max $thisHigh) $temp_range) }}
                      {{ $thisLowPct := div (sub $thisLow $min_min) $temp_range }}

                      {{/* define color gradient per. values between $temp_red and $temp_yellow are shown as a color gradient from $color_red to $color_yellow */}}
                      {{/* for colors partially in range, can represent as negative percent */}}
                      {{ $thisTempRange := sub $thisHigh $thisLow }}
                      {{ $red_pos := mul 100 (div (sub $thisHigh $temp_red) $thisTempRange) | toInt }}
                      {{ $yel_pos := mul 100 (div (sub $thisHigh $temp_yellow) $thisTempRange) | toInt }}
                      {{ $blu_pos := mul 100 (div (sub $thisHigh $temp_blue) $thisTempRange) | toInt }}
                      {{ $whi_pos := mul 100 (div (sub $thisHigh $temp_white) $thisTempRange) | toInt }}
                      {{ $gradient_string := printf "%s %d%%, %s %d%%, %s %d%%, %s %d%%" $color_red $red_pos $color_yellow $yel_pos $color_blue $blu_pos $color_white $whi_pos }}

                      {{/* output daily div */}}
                      <div style="left: {{ mul $index 14 | add 3 }}%; bottom: {{ mul $thisLowPct 100 | toInt }}%; 
                        height: {{ mul (sub $thisHighPct $thisLowPct) 100 | toInt }}%; position: absolute;
                        background:linear-gradient({{ $gradient_string | safeCSS }}); width: 10%; text-align: center; border-radius: 10px;">

                        {{/* Based on rectangle height & position, print high and low temperatures either inside or outside the rectangle. */}}
                        {{ $top_pos := -2 }}
                        {{ $bot_pos := -2 }}
                        {{ $pos_thresh := 0.20 }}
                        {{ if lt (div $thisTempRange $temp_range) $pos_thresh }} 
                          {{ $top_pos = -17 }}
                          {{ $bot_pos = -19 }}
                        {{ else if and (lt (div $thisTempRange $temp_range) (mul $pos_thresh 2)) (lt (sub 1 $thisHighPct) $thisLowPct) }}
                          {{ $bot_pos = -19 }}
                        {{ else if and (lt (div $thisTempRange $temp_range) (mul $pos_thresh 2)) (gt (sub 1 $thisHighPct) $thisLowPct) }}
                          {{ $top_pos = -17 }}
                        {{ end }}
                          <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: {{ $overlay_color | safeCSS }}; z-index: 1;  border-radius: 10px;">
                            <p style='color: #F0F0F0; position: absolute; top: {{ $top_pos }}px; left: 0px; right: 0px'>{{ $thisHigh | toInt }}</p>
                            <p style='color: #F0F0F0; position: absolute; bottom: {{ $bot_pos }}px; left: 0px; right:0px'>{{ $thisLow | toInt }}</p>
                          </div>
                        </div>
                  {{ end }}

                </div>
              </div>    
    columns:
      - size: full
        widgets:
          - type: iframe #LOL matches
            title: Recent LoL Matches
            source: https://home.example.com/widget
            height: 400
      - size: full
        widgets:
          - type: iframe #Homepage
            source: http://home.example.com
            height: 400
          - type: custom-api #Portainer OFF
            title: Portainer
            cache: 1h
            url: ${PORTAINER_URL}/api/endpoints/${PORTAINER_ENDPOINT_ID}
            headers:
              X-API-Key: ${PORTAINER_API_KEY}
            template: |
              <style>
                .list-horizontal-text.no-bullets > *:not(:last-child)::after {
                    content: none !important;
                }
                .list-horizontal-text.no-bullets > *:not(:last-child) {
                  margin-right: 1em;
                }
              </style>
              <div style="display:flex; align-items:center; gap:12px;">
                  <div style="width:40px; height:40px; flex-shrink:0; display:flex; justify-content:center; align-items:center; overflow:hidden;">
                    <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/portainer-dark.svg" width="24" height="24" style="object-fit:contain;">
                  </div>
                  <div style="flex-grow:1; min-width:0;">
                    <a class="size-h4 block text-truncate color-highlight">
                      {{ .JSON.String "Name" }}
                      <span style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--color-positive); display: inline-block; vertical-align: middle;"></span>
                    </a>
                    <ul class="list-horizontal-text no-bullets">
                      <li data-popover-type="text" data-popover-text="Containers: {{ .JSON.Int "Snapshots.0.ContainerCount" }}">
                        <p style="display:inline-flex;align-items:center;">
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1em;vertical-align:middle;margin-right:0.5em;" class="size-6 lucide lucide-box icon inline-flex" aria-hidden="true" role="img"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>
                          {{ .JSON.Int "Snapshots.0.ContainerCount" }}
                        </p>
                      </li>
                      <li data-popover-type="text" data-popover-text="Volumes: {{ .JSON.Int "Snapshots.0.VolumeCount" }}">
                        <p style="display:inline-flex;align-items:center;">
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1em;vertical-align:middle;margin-right:0.5em;" class="size-6 lucide lucide-database icon inline-flex" aria-hidden="true" role="img"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5V19A9 3 0 0 0 21 19V5"></path><path d="M3 12A9 3 0 0 0 21 12"></path></svg>
                          {{ .JSON.Int "Snapshots.0.VolumeCount"  }}
                        </p>
                      </li>
                      <li data-popover-type="text" data-popover-text="Networks: {{ .JSON.Int "Snapshots.0.DockerSnapshotRaw.Networks.#" }}">
                        <p style="display:inline-flex;align-items:center;">
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1em;vertical-align:middle;margin-right:0.5em;" class="size-6 lucide lucide-network icon inline-flex" aria-hidden="true" role="img"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg>
                          {{ .JSON.Int "Snapshots.0.DockerSnapshotRaw.Networks.#" }}
                        </p>
                      </li>
                    </ul>
                  </div>
              </div>
              <div class="margin-block-2" style="margin-top: 1em">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                  <div>
                    <div class="size-h5">Running</div>
                    <div class="size-h3 color-highlight">{{ .JSON.Int "Snapshots.0.RunningContainerCount" }}</div>
                  </div>
                  <div>
                    <div class="size-h5">Healthy</div>
                    <div class="size-h3 color-highlight">{{ .JSON.Int "Snapshots.0.HealthyContainerCount" }}</div>
                  </div>
                  <div>
                    <div class="size-h5">Stopped</div>
                    <div class="size-h3 color-highlight">{{ .JSON.Int "Snapshots.0.StoppedContainerCount" }}</div>
                  </div>
                  <div>
                    <div class="size-h5">Unhealthy</div>
                    <div class="size-h3 color-highlight">{{ .JSON.Int "Snapshots.0.DockerSnapshotRaw.Containers.#(Health=\"unhealthy\").#" }}</div>
                  </div>
                </div>
              </div>

